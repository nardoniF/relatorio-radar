services:
  db:
    image: postgis/postgis:16-3.4
    container_name: relatorio-radar-db
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
      POSTGRES_DB: relatorio_radar
    ports:
      - "5432:5432"
    volumes:
      - radar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d relatorio_radar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  radar_pgdata:
